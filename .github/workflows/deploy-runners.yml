# ==============================================================================
# Reusable Workflow: Deploy ARC Runners
# ==============================================================================
# Applies the cluster-specific BuildKit manifests first, then upgrades the ARC
# Helm release that points runners at those BuildKit workers.
# ==============================================================================

name: Deploy ARC Runners

on:
  workflow_call:
    inputs:
      cluster:
        description: "Target cluster: theia-prod or parma"
        required: true
        type: string
      component:
        description: "Component to deploy: all, buildkit, or arc"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.component }} to ${{ inputs.cluster }}
    runs-on: ubuntu-latest
    environment: arc-runners

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.1

      - name: Setup kubeconfig
        env:
          KUBECONFIG_THEIA_PROD: ${{ secrets.KUBECONFIG_THEIA_PROD }}
          KUBECONFIG_PARMA: ${{ secrets.KUBECONFIG_PARMA }}
        run: |
          set -euo pipefail

          case "${{ inputs.cluster }}" in
            theia-prod)
              if [[ -z "${KUBECONFIG_THEIA_PROD}" ]]; then
                echo "::error::Missing KUBECONFIG_THEIA_PROD secret."
                exit 1
              fi
              printf '%s' "${KUBECONFIG_THEIA_PROD}" > kubeconfig
              ;;
            parma)
              if [[ -z "${KUBECONFIG_PARMA}" ]]; then
                echo "::error::Missing KUBECONFIG_PARMA secret."
                exit 1
              fi
              printf '%s' "${KUBECONFIG_PARMA}" > kubeconfig
              ;;
            *)
              echo "::error::Unsupported cluster '${{ inputs.cluster }}'. Use 'theia-prod' or 'parma'."
              exit 1
              ;;
          esac

          chmod 600 kubeconfig

          echo "Connected contexts:"
          KUBECONFIG="${PWD}/kubeconfig" kubectl config get-contexts
          echo ""
          echo "Cluster nodes:"
          KUBECONFIG="${PWD}/kubeconfig" kubectl get nodes -o wide

      - name: Select cluster deployment inputs
        id: target
        run: |
          set -euo pipefail

          case "${{ inputs.cluster }}" in
            theia-prod)
              echo "buildkit_path=infra/theia-prod/buildkit-exp" >> "${GITHUB_OUTPUT}"
              echo "helm_values=helm-chart/theia-arc-bundle/values.yaml" >> "${GITHUB_OUTPUT}"
              ;;
            parma)
              echo "buildkit_path=infra/parma/buildkit" >> "${GITHUB_OUTPUT}"
              echo "helm_values=helm-chart/theia-arc-bundle/values.yaml -f helm-chart/theia-arc-bundle/values-arm64.yaml" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::Unsupported cluster '${{ inputs.cluster }}'. Use 'theia-prod' or 'parma'."
              exit 1
              ;;
          esac

          case "${{ inputs.component }}" in
            all|buildkit|arc)
              ;;
            *)
              echo "::error::Unsupported component '${{ inputs.component }}'. Use 'all', 'buildkit', or 'arc'."
              exit 1
              ;;
          esac

      - name: Apply BuildKit manifests
        if: inputs.component == 'all' || inputs.component == 'buildkit'
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
          BUILDKIT_PATH: ${{ steps.target.outputs.buildkit_path }}
        run: |
          set -euo pipefail

          echo "Applying BuildKit manifests from ${BUILDKIT_PATH}"
          kubectl apply -f "${BUILDKIT_PATH}/namespace.yaml"
          kubectl apply -f "${BUILDKIT_PATH}/configmap.yaml"
          kubectl apply -f "${BUILDKIT_PATH}/service.yaml"
          kubectl apply -f "${BUILDKIT_PATH}/statefulset.yaml"

          namespace="$(awk '/namespace:/ {print $2; exit}' "${BUILDKIT_PATH}/statefulset.yaml")"
          kubectl rollout status statefulset/buildkitd -n "${namespace}" --timeout=10m
          kubectl get statefulset,pods,pvc,svc -n "${namespace}" -l app.kubernetes.io/name=buildkitd

      - name: Deploy ARC Helm release
        if: inputs.component == 'all' || inputs.component == 'arc'
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
          HELM_VALUES: ${{ steps.target.outputs.helm_values }}
        run: |
          set -euo pipefail

          helm dependency build helm-chart/theia-arc-bundle

          # HELM_VALUES intentionally contains one or two -f arguments selected
          # from the fixed cluster allowlist above.
          helm upgrade --install theia-arc-systems \
            helm-chart/theia-arc-bundle \
            --namespace arc-systems \
            --create-namespace \
            -f ${HELM_VALUES} \
            --set arcController.enabled=true \
            --set arcRunners.enabled=false \
            --set arcRunnersArm.enabled=false \
            --set arcRunnersExp.enabled=false \
            --set arcRunnersArmBuildkit.enabled=false \
            --wait

          helm upgrade --install theia-arc-runners \
            helm-chart/theia-arc-bundle \
            --namespace arc-runners \
            --create-namespace \
            -f ${HELM_VALUES} \
            --set arcController.enabled=false \
            --wait

      - name: Verify deployment
        if: always()
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: |
          set -euo pipefail

          echo "ARC systems:"
          kubectl get pods -n arc-systems -o wide || true
          echo ""
          echo "ARC runners:"
          kubectl get autoscalingrunnersets,pods -n arc-runners -o wide || true
          echo ""
          echo "BuildKit workers:"
          if [[ "${{ inputs.cluster }}" == "theia-prod" ]]; then
            kubectl get statefulset,pods,pvc,svc -n buildkit-exp -o wide || true
          else
            kubectl get statefulset,pods,pvc,svc -n buildkit -o wide || true
          fi
