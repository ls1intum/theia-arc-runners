# ==============================================================================
# Reusable Workflow: Deploy ARC Runners
# ==============================================================================
# Applies the cluster-specific BuildKit manifests first, then upgrades the ARC
# Helm release that points runners at those BuildKit workers.
# ==============================================================================

name: Deploy ARC Runners

on:
  workflow_call:
    inputs:
      cluster:
        description: "Target cluster: stud, theia-prod, or parma"
        required: true
        type: string
      component:
        description: "Component to deploy: all, buildkit, or arc"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.component }} to ${{ inputs.cluster }}
    runs-on: ubuntu-latest
    environment: arc-runners

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.1

      - name: Setup kubeconfig
        env:
          KUBECONFIG_STUD: ${{ secrets.KUBECONFIG_STUD }}
          KUBECONFIG_THEIA_PROD: ${{ secrets.KUBECONFIG_THEIA_PROD }}
          KUBECONFIG_PARMA: ${{ secrets.KUBECONFIG_PARMA }}
        run: |
          set -euo pipefail

          case "${{ inputs.cluster }}" in
            stud)
              if [[ -z "${KUBECONFIG_STUD}" ]]; then
                echo "::error::Missing KUBECONFIG_STUD secret."
                exit 1
              fi
              printf '%s' "${KUBECONFIG_STUD}" > kubeconfig
              ;;
            theia-prod)
              if [[ -z "${KUBECONFIG_THEIA_PROD}" ]]; then
                echo "::error::Missing KUBECONFIG_THEIA_PROD secret."
                exit 1
              fi
              printf '%s' "${KUBECONFIG_THEIA_PROD}" > kubeconfig
              ;;
            parma)
              if [[ -z "${KUBECONFIG_PARMA}" ]]; then
                echo "::error::Missing KUBECONFIG_PARMA secret."
                exit 1
              fi
              printf '%s' "${KUBECONFIG_PARMA}" > kubeconfig
              ;;
            *)
              echo "::error::Unsupported cluster '${{ inputs.cluster }}'. Use 'stud', 'theia-prod', or 'parma'."
              exit 1
              ;;
          esac

          chmod 600 kubeconfig

          echo "Connected contexts:"
          KUBECONFIG="${PWD}/kubeconfig" kubectl config get-contexts
          echo ""
          echo "Cluster nodes:"
          KUBECONFIG="${PWD}/kubeconfig" kubectl get nodes -o wide

      - name: Select cluster deployment inputs
        id: target
        run: |
          set -euo pipefail

          case "${{ inputs.cluster }}" in
            stud)
              echo "buildkit_path=infra/stud/buildkit-exp" >> "${GITHUB_OUTPUT}"
              echo "helm_values=helm-chart/theia-arc-bundle/values.yaml -f helm-chart/theia-arc-bundle/values-stud.yaml" >> "${GITHUB_OUTPUT}"
              echo "buildkit_namespace=buildkit-exp" >> "${GITHUB_OUTPUT}"
              ;;
            theia-prod)
              echo "buildkit_path=infra/theia-prod/buildkit-exp" >> "${GITHUB_OUTPUT}"
              echo "helm_values=helm-chart/theia-arc-bundle/values.yaml -f helm-chart/theia-arc-bundle/values-theia-prod.yaml" >> "${GITHUB_OUTPUT}"
              echo "buildkit_namespace=buildkit-exp" >> "${GITHUB_OUTPUT}"
              ;;
            parma)
              echo "buildkit_path=infra/parma/buildkit" >> "${GITHUB_OUTPUT}"
              echo "helm_values=helm-chart/theia-arc-bundle/values.yaml -f helm-chart/theia-arc-bundle/values-parma.yaml" >> "${GITHUB_OUTPUT}"
              echo "buildkit_namespace=buildkit" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::Unsupported cluster '${{ inputs.cluster }}'. Use 'stud', 'theia-prod', or 'parma'."
              exit 1
              ;;
          esac

          case "${{ inputs.component }}" in
            all|buildkit|arc)
              ;;
            *)
              echo "::error::Unsupported component '${{ inputs.component }}'. Use 'all', 'buildkit', or 'arc'."
              exit 1
              ;;
          esac

      - name: Apply BuildKit manifests
        if: inputs.component == 'all' || inputs.component == 'buildkit'
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
          BUILDKIT_PATH: ${{ steps.target.outputs.buildkit_path }}
        run: |
          set -euo pipefail

          echo "Applying BuildKit manifests from ${BUILDKIT_PATH}"
          kubectl apply -f "${BUILDKIT_PATH}/namespace.yaml"
          namespace="$(awk '/namespace:/ {print $2; exit}' "${BUILDKIT_PATH}/statefulset.yaml")"
          kubectl wait --for=jsonpath='{.status.phase}'=Active "namespace/${namespace}" --timeout=60s
          kubectl apply -f "${BUILDKIT_PATH}/configmap.yaml"
          kubectl apply -f "${BUILDKIT_PATH}/service.yaml"
          kubectl apply -f "${BUILDKIT_PATH}/statefulset.yaml"

          kubectl rollout status statefulset/buildkitd -n "${namespace}" --timeout=10m
          kubectl get statefulset,pods,pvc,svc -n "${namespace}" -l app.kubernetes.io/name=buildkitd

      - name: Deploy ARC Helm release
        if: inputs.component == 'all' || inputs.component == 'arc'
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
          HELM_VALUES: ${{ steps.target.outputs.helm_values }}
          EDUIDEC_GITHUB_TOKEN: ${{ secrets.EDUIDEC_GITHUB_TOKEN }}
          EDUIDEC_GITHUB_APP_ID: ${{ secrets.EDUIDEC_GITHUB_APP_ID }}
          EDUIDEC_GITHUB_APP_INSTALLATION_ID: ${{ secrets.EDUIDEC_GITHUB_APP_INSTALLATION_ID }}
          EDUIDEC_GITHUB_APP_PRIVATE_KEY: ${{ secrets.EDUIDEC_GITHUB_APP_PRIVATE_KEY }}
          LS1INTUM_GITHUB_TOKEN: ${{ secrets.LS1INTUM_GITHUB_TOKEN }}
          LS1INTUM_GITHUB_APP_ID: ${{ secrets.LS1INTUM_GITHUB_APP_ID }}
          LS1INTUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.LS1INTUM_GITHUB_APP_INSTALLATION_ID }}
          LS1INTUM_GITHUB_APP_PRIVATE_KEY: ${{ secrets.LS1INTUM_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          helm dependency build helm-chart/theia-arc-bundle

          kubectl create namespace arc-systems --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace arc-runners --dry-run=client -o yaml | kubectl apply -f -

          create_github_secret() {
            local name="$1"
            local token="$2"
            local app_id="$3"
            local installation_id="$4"
            local private_key="$5"

            if [[ -n "${token}" ]]; then
              kubectl create secret generic "${name}" \
                --namespace arc-runners \
                --from-literal=github_token="${token}" \
                --dry-run=client -o yaml | kubectl apply -f -
              return
            fi

            if [[ -n "${app_id}" && -n "${installation_id}" && -n "${private_key}" ]]; then
              local key_file
              key_file="$(mktemp)"
              printf '%s' "${private_key}" > "${key_file}"
              kubectl create secret generic "${name}" \
                --namespace arc-runners \
                --from-literal=github_app_id="${app_id}" \
                --from-literal=github_app_installation_id="${installation_id}" \
                --from-file=github_app_private_key="${key_file}" \
                --dry-run=client -o yaml | kubectl apply -f -
              rm -f "${key_file}"
              return
            fi

            echo "::error::Missing credentials for Kubernetes secret ${name}. Provide either *_GITHUB_TOKEN or all GitHub App secrets."
            exit 1
          }

          create_github_secret \
            github-arc-secret-eduidec \
            "${EDUIDEC_GITHUB_TOKEN}" \
            "${EDUIDEC_GITHUB_APP_ID}" \
            "${EDUIDEC_GITHUB_APP_INSTALLATION_ID}" \
            "${EDUIDEC_GITHUB_APP_PRIVATE_KEY}"

          create_github_secret \
            github-arc-secret \
            "${LS1INTUM_GITHUB_TOKEN}" \
            "${LS1INTUM_GITHUB_APP_ID}" \
            "${LS1INTUM_GITHUB_APP_INSTALLATION_ID}" \
            "${LS1INTUM_GITHUB_APP_PRIVATE_KEY}"

          # HELM_VALUES intentionally contains one or two -f arguments selected
          # from the fixed cluster allowlist above.
          helm upgrade --install theia-arc-systems \
            helm-chart/theia-arc-bundle \
            --namespace arc-systems \
            -f ${HELM_VALUES} \
            --set createNamespaces=false \
            --set ghaArcController.enabled=true \
            --set ghaArcScaleSetStatelessAmdEduide.enabled=false \
            --set ghaArcScaleSetStatelessArmEduide.enabled=false \
            --set ghaArcScaleSetAmdEduide.enabled=false \
            --set ghaArcScaleSetArmEduide.enabled=false \
            --set ghaArcScaleSetAmdLs1intum.enabled=false \
            --set ghaArcScaleSetArmLs1intum.enabled=false \
            --wait

          helm upgrade --install theia-arc-runners \
            helm-chart/theia-arc-bundle \
            --namespace arc-runners \
            -f ${HELM_VALUES} \
            --set createNamespaces=false \
            --set ghaArcController.enabled=false \
            --wait

      - name: Verify deployment
        if: always()
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: |
          set -euo pipefail

          echo "ARC systems:"
          kubectl get pods -n arc-systems -o wide || true
          echo ""
          echo "ARC runners:"
          kubectl get autoscalingrunnersets,pods -n arc-runners -o wide || true
          echo ""
          echo "BuildKit workers:"
          kubectl get statefulset,pods,pvc,svc -n "${{ steps.target.outputs.buildkit_namespace }}" -o wide || true
