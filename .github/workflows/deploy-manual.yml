# ==============================================================================
# Manual Deployment Workflow
# ==============================================================================

name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Target cluster"
        required: true
        type: choice
        default: theia-prod
        options:
          - theia-prod
          - parma
      component:
        description: "Component to deploy"
        required: true
        type: choice
        default: all
        options:
          - all
          - buildkit
          - arc

jobs:
  deploy:
    name: Deploy ${{ inputs.component }} to ${{ inputs.cluster }}
    uses: ./.github/workflows/deploy-runners.yml
    with:
      cluster: ${{ inputs.cluster }}
      component: ${{ inputs.component }}
    secrets: inherit
