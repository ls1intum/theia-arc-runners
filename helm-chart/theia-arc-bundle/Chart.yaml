apiVersion: v2
name: theia-arc-bundle
description: GitHub Actions Runner Controller for self-hosted runners
type: application
version: 0.1.0
appVersion: "1.0"
home: https://github.com/ls1intum/theia-arc-runners
sources:
  - https://github.com/ls1intum/theia-arc-runners
maintainers:
  - name: ls1intum
    url: https://github.com/ls1intum

dependencies:
  # ARC controller: shared controller release, not tied to one org or architecture.
  - name: gha-runner-scale-set-controller
    version: 0.14.2
    repository: "oci://ghcr.io/actions/actions-runner-controller-charts"
    alias: ghaArcController
    condition: ghaArcController.enabled

  # ARC scale set: AMD64 BuildKit runner set for EduIDE.
  - name: gha-runner-scale-set
    version: 0.14.2
    repository: "oci://ghcr.io/actions/actions-runner-controller-charts"
    alias: ghaArcScaleSetAmdEduide
    condition: ghaArcScaleSetAmdEduide.enabled

  # ARC scale set: ARM64 BuildKit runner set for EduIDE.
  - name: gha-runner-scale-set
    version: 0.14.2
    repository: "oci://ghcr.io/actions/actions-runner-controller-charts"
    alias: ghaArcScaleSetArmEduide
    condition: ghaArcScaleSetArmEduide.enabled

  # ARC scale set: AMD64 BuildKit runner set for ls1intum.
  - name: gha-runner-scale-set
    version: 0.14.2
    repository: "oci://ghcr.io/actions/actions-runner-controller-charts"
    alias: ghaArcScaleSetAmdLs1intum
    condition: ghaArcScaleSetAmdLs1intum.enabled

  # ARC scale set: ARM64 BuildKit runner set for ls1intum.
  - name: gha-runner-scale-set
    version: 0.14.2
    repository: "oci://ghcr.io/actions/actions-runner-controller-charts"
    alias: ghaArcScaleSetArmLs1intum
    condition: ghaArcScaleSetArmLs1intum.enabled
