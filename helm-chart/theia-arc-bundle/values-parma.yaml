# Cluster-specific values for parma.
# Purpose: ARM64 BuildKit runner scale sets for EduIDE and ls1intum.

global:
  storageClass: "longhorn"
  nodeSelector:
    kubernetes.io/arch: arm64

# On parma, arc-runners namespace is owned by the theia-arc-runners release.
# Set to false to avoid Helm SSA ownership conflicts on upgrade.
createNamespaces: false


ghaArcScaleSetAmdEduide:
  enabled: false

ghaArcScaleSetAmdLs1intum:
  enabled: false

ghaArcScaleSetArmEduide:
  enabled: true
  runnerScaleSetName: "arc-buildkit-eduide-parma-arm64"

ghaArcScaleSetArmLs1intum:
  enabled: true
  runnerScaleSetName: "arc-buildkit-ls1intum-parma-arm64"
