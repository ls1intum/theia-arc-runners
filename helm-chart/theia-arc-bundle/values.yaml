# Shared defaults for all clusters. Apply exactly one cluster overlay on top:
# - values-stud.yaml
# - values-theia-prod.yaml
# - values-parma.yaml
#
# Cluster overlays select storage, architecture, and the active runner scale
# sets. Keep all scale sets disabled here so a base-only render cannot
# accidentally register production runners.

global:
  storageClass: ""
  nodeSelector: {}
  tolerations: []

createNamespaces: true

ghaArcController:
  enabled: true

# AMD64 BuildKit runner set for EduIDE.
# BuildKit workers live in the buildkit namespace (raw manifests).
# Cluster overlays set the final runner label.
ghaArcScaleSetAmdEduide:
  enabled: false
  githubConfigUrl: "https://github.com/EduIDE"
  githubConfigSecret: "github-arc-secret-eduidec"
  # Operational baseline. Tune with cluster size and runner pod resources.
  minRunners: 10
  maxRunners: 50
  runnerScaleSetName: ""
  controllerServiceAccount:
    namespace: arc-systems
    name: theia-arc-systems-gha-rs-controller
  buildkit:
    namespace: buildkit
    # Must match the BuildKit StatefulSet replica count for the target cluster.
    numWorkers: 7
  template:
    spec:
      serviceAccountName: arc-runner-set-amd-eduide-sa
      initContainers:
        - name: init-dind-externals
          image: ghcr.io/actions/actions-runner:latest
          command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
      containers:
        - name: dind
          image: docker:dind
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=1001
            - --registry-mirror=http://131.159.88.117:30081
            - --insecure-registry=131.159.88.117:30081
          securityContext:
            privileged: true
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: dind-externals
              mountPath: /home/runner/externals
        - name: runner
          image: ghcr.io/actions/actions-runner:latest
          command: ["/home/runner/run.sh"]
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
              value: "false"
            # Injected into every job so workflow steps can compute the correct BuildKit worker
            # address without hard-coding the namespace or replica count.
            - name: BUILDKIT_NAMESPACE
              value: buildkit
            - name: BUILDKIT_NUM_WORKERS
              value: "7"
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 16000m
              memory: 32Gi
      volumes:
        - name: work
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}

