{{- if or .Values.ghaArcScaleSetAmdEduide.enabled .Values.ghaArcScaleSetArmEduide.enabled .Values.ghaArcScaleSetAmdLs1intum.enabled .Values.ghaArcScaleSetArmLs1intum.enabled }}
{{- if .Values.ghaArcScaleSetAmdEduide.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner-set-amd-eduide-sa
  namespace: arc-runners
  labels:
    {{- include "theia-arc-bundle.labels" . | nindent 4 }}
---
{{- end }}
{{- if .Values.ghaArcScaleSetAmdLs1intum.enabled }}
apiVersion: v1
