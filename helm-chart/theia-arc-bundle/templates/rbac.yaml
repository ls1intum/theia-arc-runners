    {{- include "theia-arc-bundle.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-runner-kubernetes-mode-role
  namespace: arc-runners
  labels:
    {{- include "theia-arc-bundle.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
{{- if .Values.ghaArcScaleSetAmdEduide.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-runner-set-amd-eduide-rb
  namespace: arc-runners
  labels:
    {{- include "theia-arc-bundle.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: arc-runner-set-amd-eduide-sa
    namespace: arc-runners
roleRef:
  kind: Role
  name: arc-runner-kubernetes-mode-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.ghaArcScaleSetAmdLs1intum.enabled }}
